services:
  cloudmaker-api:
    build: .
    container_name: cloudmaker-api
    restart: always
    pid: host
    privileged: true
    security_opt:
      - label:disable
    ports:
      - "8000:8000"
    volumes:
      - ${PWD}:${PWD}
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
    working_dir: ${PWD}
    environment:
      - PYTHONUNBUFFERED=1
